### model
model_name_or_path: ${BASE_MODEL_PATH}
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
resize_vocab: false

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z2_config.json
flash_attn: fa2

### dataset
dataset: svgmix256_sft_canvas256_train
eval_dataset: svgmix256_sft_canvas256_eval
dataset_dir: ${LLAMA_FACTORY_DIR}/data
media_dir: ${LLAMA_FACTORY_DIR}/data
template: qwen2_vl
cutoff_len: 16384
overwrite_cache: false
preprocessing_batch_size: 2048
preprocessing_num_workers: 64
dataloader_num_workers: 16
tokenized_path: ${LLAMA_FACTORY_DIR}/data/tokenized/svgmix256_qwen25vl_7b_cut16384_canvas256_v2
data_shared_file_system: true

### output
output_dir: ${OUTPUT_DIR}/stage1_7b
logging_steps: 10
save_steps: 500
save_total_limit: 5
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none
use_swanlab: true
swanlab_project: LLM4SVG
swanlab_workspace: your_username
swanlab_run_name: qwen2_5vl_7b_full_sft_canvas256_v2
swanlab_mode: cloud

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.01
bf16: true
fp16: false
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null
group_by_length: true

### eval
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 500

### generation
max_length: 24576
max_new_tokens: 16384
